<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>{{ title }}</title>
  <meta name="description" content="{{ site.description }}" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='rgb(154,59,38)'/%3E%3Ctext%20x='16'%20y='23'%20text-anchor='middle'%20font-family='Georgia,serif'%20font-size='20'%20fill='rgb(253,253,252)'%3Eb%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ '/css/styles.css' | url }}">
</head>
<body>
  <header class="masthead">
    <h1>{{ site.name }}</h1>
    <p>{{ site.tagline }}</p>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
